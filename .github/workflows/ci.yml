name: Python CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest pytest-cov pycodestyle
    - name: Test with pytest
      run: |
        pytest --cov=todo_manager tests/
    - name: Check style with pycodestyle
      run: |
        pycodestyle todo_manager/